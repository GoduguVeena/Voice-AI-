language: telugu
dataset: IndicTTS Telugu
paths:
  data: data/Telugu
  output: Results/Telugu
  checkpoint: Results/Telugu/checkpoints/latest.pth.tar
upstream:
  train: [python, train.py, --restore_step, "0", --dataset, indictts_telugu]
  inference: [python, synthesize.py, --text, Telugu/test_sentences.txt, --restore_step, "0"]
training:
  train_hours: 5
  validation_hours: 1
  sample_rate: 22050
  seed: 42